# One-click backend deploy on Render (New > Blueprint > pick this repo).
# The frontend deploys separately on Vercel (root directory: frontend).
services:
  - type: web
    name: grid07-api # internal Render service name; renaming would create a new service
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://expertsfor.me
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # sign-up confirmation emails (Brevo, free 300/day). When both are set,
      # new users must confirm their email before they can sign in.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false # a sender address you verified in Brevo
      - key: FRONTEND_URL
        sync: false # e.g. https://expertsfor.me (used in the email link)
